services:
  litepaw:
    build: .
    ports:
      - "8765:8765"
    environment:
      - LITEPAW_LLM_MODEL=qwen-plus
      - LITEPAW_LLM_API_KEY=${LITEPAW_LLM_API_KEY}
      - LITEPAW_LLM_BASE_URL=${LITEPAW_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LITEPAW_LANGUAGE=zh
    volumes:
      - litepaw-workspace:/app/workspace
    restart: unless-stopped

volumes:
  litepaw-workspace:
