[project]
name = "litepaw"
version = "0.1.0"
description = "Lightweight QwenPaw memory service for blog deployment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "agentscope>=0.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "reme-ai==0.4.1.3",
]

[project.scripts]
litepaw = "litepaw.main:main"
litepaw-memory = "litepaw.memory_tool:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.2.2",
]
